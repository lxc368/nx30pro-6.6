# File: .github/workflows/update-checker.yml
# Description: Source code update checker
#
# 注意：本仓库是 fork，GitHub 对 fork 仓库的定时工作流默认禁用（disabled_fork）。
# 首次使用需在 Actions 页面手动点一次 "Enable workflow"，否则下面的 schedule 永远不会跑。
# 触发构建用的 token（secrets.ACTIONS_TRIGGER_PAT）必须是 Classic PAT 且带 repo 权限，
# GITHUB_TOKEN 无法触发其他工作流。

name: Update Checker

env:
  REPO_URL: https://github.com/padavanonly/immortalwrt-mt798x-6.6
  REPO_BRANCH: openwrt-24.10-6.6

on:
  workflow_dispatch:
  schedule:
    - cron: 0 18 * * *

jobs:
  check:
    runs-on: ubuntu-latest

    steps:

    # 用 ls-remote 取分支 HEAD，几百 KB 的请求代替整仓 clone（原来要拉数百 MB）
    - name: Get Commit Hash
      id: getHash
      run: |
        git ls-remote $REPO_URL refs/heads/$REPO_BRANCH | cut -f1 | tee .commitHash.new
        [ -s .commitHash.new ] || { echo "::error::failed to get remote HEAD of $REPO_BRANCH"; exit 1; }
        echo "commitHash=$(cat .commitHash.new)" >> $GITHUB_OUTPUT

    - name: Compare Commit Hash
      id: cacheHash
      uses: actions/cache@v6
      with:
        path: .commitHash
        key: HEAD-${{ steps.getHash.outputs.commitHash }}

    - name: Save New Commit Hash
      if: steps.cacheHash.outputs.cache-hit != 'true'
      run: cp .commitHash.new .commitHash

    - name: Trigger build
      if: steps.cacheHash.outputs.cache-hit != 'true'
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets.ACTIONS_TRIGGER_PAT }}
        event-type: Source Code Update

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2.1.0
      with:
        retain_days: 1
        keep_minimum_runs: 1
